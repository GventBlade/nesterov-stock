<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сканер</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; padding: 10px; max-width: 480px; margin: 0 auto; background: #f4f6f8; }
        .card { background: white; padding: 12px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.06); margin-bottom: 10px; }
        .form-group { margin-bottom: 8px; }
        label { display: block; font-weight: 600; font-size: 12px; margin-bottom: 3px; color: #495057; }
        input, select, textarea { width: 100%; padding: 8px; font-size: 14px; border: 1px solid #ced4da; border-radius: 5px; box-sizing: border-box; }
        textarea { height: 44px; resize: none; }
        .row { display: flex; gap: 6px; }
        .col { flex: 1; }
        .price-group { display: flex; gap: 4px; }
        .price-group input { flex: 2; }
        .price-group select { flex: 1; padding: 4px; font-size: 12px; font-weight: bold; }

        button { width: 100%; padding: 10px; background: #28a745; color: white; border: none; font-size: 15px; border-radius: 5px; font-weight: bold; cursor: pointer; }
        .btn-nav { background: #007bff; text-decoration: none; display: block; text-align: center; color: white; padding: 10px; border-radius: 5px; font-weight: bold; margin-bottom: 10px; }

        .camera-wrapper { width: 100%; height: 160px; overflow: hidden; border-radius: 8px; background: #000; position: relative; margin-bottom: 8px; }
        #reader { width: 100% !important; height: 100% !important; border: none !important; }
        #reader video { object-fit: cover !important; height: 160px !important; }

        .status { padding: 10px; background: #e9ecef; border-radius: 5px; font-size: 13px; font-weight: bold; text-align: center; word-break: break-all; margin-top: 8px; }
        .parsed-box { background: #e7f5ff; border: 1px solid #a5d8ff; padding: 8px; border-radius: 5px; font-size: 12px; margin-top: 8px; display: none; color: #004085; }
        .btn-info-toggle { background: #17a2b8; font-size: 11px; padding: 6px 10px; width: auto; margin-top: 5px; border-radius: 4px; color: white; border: none; cursor: pointer; }

        .img-preview { max-width: 80px; max-height: 80px; margin-top: 4px; border-radius: 4px; display: none; object-fit: cover; }
    </style>
</head>
<body>

    <div id="login-section" class="card">
        <h2>🔑 Вхід</h2>
        <form id="login-form">
            <div class="form-group"><label>Логін:</label><input type="text" id="username" required></div>
            <div class="form-group"><label>Пароль:</label><input type="password" id="password" required></div>
            <button type="submit">Увійти</button>
        </form>
    </div>

    <div id="scanner-section" style="display: none;">
        <a href="/products/" class="btn-nav">📋 Відкрити список усіх товарів / Склад</a>

        <div class="card">
            <div class="camera-wrapper">
                <div id="reader"></div>
            </div>

            <form id="scan-form">
                <div class="form-group">
                    <label>1. Комірка (напр. 101-А2):</label>
                    <input type="text" id="location" placeholder="101-А2" autofocus autocomplete="off">
                </div>

                <div class="form-group">
                    <label>2. Штрихкод / QR / Серійник:</label>
                    <input type="text" id="barcode" required placeholder="Скануйте...">
                </div>

                <div class="form-group" style="background: #f8f9fa; padding: 6px; border-radius: 5px; border: 1px dashed #ced4da;">
                    <label>3. 📷 Фото товару (опціонально):</label>
                    <input type="file" id="image-input" accept="image/*" capture="environment">
                    <img id="image-preview" class="img-preview" alt="Прев'ю">
                </div>

                <div class="form-group">
                    <label>Назва товару:</label>
                    <input type="text" id="name" placeholder="Назва">
                </div>

                <div class="form-group">
                    <label>Примітка / Опис:</label>
                    <textarea id="description" placeholder="Наприклад: Б/У, стан, комплектація..."></textarea>
                </div>

                <div class="row">
                    <div class="col form-group">
                        <label>Закуп:</label>
                        <div class="price-group">
                            <input type="number" step="0.01" id="purchase_price" placeholder="0.00">
                            <select id="purchase_currency">
                                <option value="EUR">EUR (€)</option>
                                <option value="USD">USD ($)</option>
                                <option value="UAH">UAH (₴)</option>
                            </select>
                        </div>
                    </div>
                    <div class="col form-group">
                        <label>Продаж:</label>
                        <div class="price-group">
                            <input type="number" step="0.01" id="selling_price" placeholder="0.00">
                            <select id="selling_currency">
                                <option value="UAH">UAH (₴)</option>
                                <option value="EUR">EUR (€)</option>
                                <option value="USD">USD ($)</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label>Кількість:</label>
                    <input type="number" id="quantity" value="1" min="1">
                </div>

                <button type="submit">Зберегти / Додати</button>
            </form>

            <button type="button" id="toggle-info-btn" class="btn-info-toggle" style="display:none;" onclick="toggleExtraInfo()">ℹ️ Деталі штрихкоду</button>
            <div id="parsed-extra-box" class="parsed-box"></div>
        </div>

        <button type="button" id="logout-btn" style="background:#6c757d; font-size:12px; margin-top: 5px;">Вийти</button>
    </div>

    <div id="status" class="status">Очікування сканування...</div>

    <script>
        const html5QrCode = new Html5Qrcode("reader");
        const statusDiv = document.getElementById('status');
        const parsedBox = document.getElementById('parsed-extra-box');
        const toggleInfoBtn = document.getElementById('toggle-info-btn');

        const locationInput = document.getElementById('location');
        const barcodeInput = document.getElementById('barcode');
        const imageInput = document.getElementById('image-input');
        const imagePreview = document.getElementById('image-preview');
        const cellRegex = /^\d{3}-[A-Za-zА-Яа-я]\d$/;

        let isCooldown = false;

        imageInput.addEventListener('change', function() {
            const file = this.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    imagePreview.src = e.target.result;
                    imagePreview.style.display = 'block';
                }
                reader.readAsDataURL(file);
            } else {
                imagePreview.style.display = 'none';
            }
        });

        function playBeep() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                osc.frequency.value = 1200;
                osc.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.1);
            } catch(e){}
        }

        window.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('jwt_token')) showScanner();
            else showLogin();
        });

        function showLogin() {
            document.getElementById('login-section').style.display = 'block';
            document.getElementById('scanner-section').style.display = 'none';
        }

        function showScanner() {
            document.getElementById('login-section').style.display = 'none';
            document.getElementById('scanner-section').style.display = 'block';
            startCamera();
        }

        function startCamera() {
            const config = {
                fps: 20,
                qrbox: { width: 160, height: 160 },
                aspectRatio: 1.0,
                formatsToSupport: [
                    Html5QrcodeSupportedFormats.QR_CODE,
                    Html5QrcodeSupportedFormats.DATA_MATRIX,
                    Html5QrcodeSupportedFormats.EAN_13,
                    Html5QrcodeSupportedFormats.CODE_128,
                    Html5QrcodeSupportedFormats.EAN_8
                ],
                experimentalFeatures: { useBarCodeDetectorIfSupported: true }
            };

            html5QrCode.start(
                { facingMode: "environment" },
                config,
                (text) => {
                    if (isCooldown) return;
                    isCooldown = true;

                    playBeep();
                    if (navigator.vibrate) navigator.vibrate(80);

                    const clean = text.trim();
                    if (cellRegex.test(clean)) {
                        locationInput.value = clean.toUpperCase();
                        statusDiv.innerText = `📍 Зчитано комірку: ${clean}`;
                        statusDiv.style.background = "#d1ecf1";
                        statusDiv.style.color = "#0c5460";
                        barcodeInput.focus();
                    } else {
                        barcodeInput.value = clean;
                        statusDiv.innerText = `🔍 Зчитано код/QR: ${clean}`;
                        statusDiv.style.background = "#d1ecf1";
                        statusDiv.style.color = "#0c5460";
                        document.getElementById('name').focus();
                    }

                    setTimeout(() => { isCooldown = false; }, 2000);
                },
                () => {}
            );
        }

        function toggleExtraInfo() {
            if (parsedBox.style.display === 'none') {
                parsedBox.style.display = 'block';
                toggleInfoBtn.innerText = "🔼 Сховати деталі";
            } else {
                parsedBox.style.display = 'none';
                toggleInfoBtn.innerText = "ℹ️ Деталі штрихкоду";
            }
        }

        function formatParsedAttributes(extraInfo) {
            if (!extraInfo) return '';
            const attrs = extraInfo.parsed_attributes || {};
            let html = '';

            if (attrs.country) html += `<b>Країна:</b> ${attrs.country}<br>`;
            if (attrs.prefix) html += `<b>Префікс GS1:</b> ${attrs.prefix}<br>`;
            if (attrs.serial_number) html += `<b>Серійник:</b> ${attrs.serial_number}<br>`;
            if (attrs.article_code) html += `<b>Артикул:</b> ${attrs.article_code}<br>`;
            if (attrs.qr_type) html += `<b>Тип QR:</b> ${attrs.qr_type}<br>`;

            if (!html && extraInfo.format) {
                html = `<b>Формат:</b> ${extraInfo.format}`;
            }
            return html;
        }

        // ПОВНЕ ОЧИЩЕННЯ ФОРМИ
        function resetForm() {
            document.getElementById('barcode').value = '';
            document.getElementById('name').value = '';
            document.getElementById('description').value = '';
            document.getElementById('purchase_price').value = '';
            document.getElementById('selling_price').value = '';
            document.getElementById('purchase_currency').value = 'EUR';
            document.getElementById('selling_currency').value = 'UAH';
            document.getElementById('quantity').value = '1';
            imageInput.value = '';
            imagePreview.style.display = 'none';
            toggleInfoBtn.style.display = 'none';
            parsedBox.style.display = 'none';
            parsedBox.innerHTML = '';
        }

        document.getElementById('scan-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const token = localStorage.getItem('jwt_token');

            const formData = new FormData();
            formData.append('location_code', locationInput.value.trim());
            formData.append('barcode', barcodeInput.value.trim());
            formData.append('name', document.getElementById('name').value.trim());
            formData.append('description', document.getElementById('description').value.trim());
            formData.append('quantity', parseInt(document.getElementById('quantity').value) || 1);

            if (document.getElementById('purchase_price').value) {
                formData.append('purchase_price', document.getElementById('purchase_price').value);
            }
            formData.append('purchase_currency', document.getElementById('purchase_currency').value);

            if (document.getElementById('selling_price').value) {
                formData.append('selling_price', document.getElementById('selling_price').value);
            }
            formData.append('selling_currency', document.getElementById('selling_currency').value);

            if (imageInput.files[0]) {
                formData.append('image', imageInput.files[0]);
            }

            try {
                const res = await fetch('/api/scan/', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` },
                    body: formData
                });

                if (res.ok) {
                    const prod = await res.json();

                    // Сповіщення про додавання
                    statusDiv.innerText = `✅ Товар "${prod.name}" успішно додано! (Залишок: ${prod.quantity} шт.)`;
                    statusDiv.style.background = "#d4edda";
                    statusDiv.style.color = "#155724";

                    // Очищаємо всі поля форми під новий товар
                    resetForm();

                    // Переводимо фокус на сканування нового товару
                    barcodeInput.focus();
                } else {
                    const err = await res.json();
                    statusDiv.innerText = `❌ Помилка збереження: ${JSON.stringify(err)}`;
                    statusDiv.style.background = "#f8d7da";
                    statusDiv.style.color = "#721c24";
                }
            } catch (err) {
                statusDiv.innerText = "❌ Помилка з'єднання з сервером";
                statusDiv.style.background = "#f8d7da";
                statusDiv.style.color = "#721c24";
            }
        });

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const res = await fetch('/api/token/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: document.getElementById('username').value,
                    password: document.getElementById('password').value
                })
            });
            if (res.ok) {
                const data = await res.json();
                localStorage.setItem('jwt_token', data.access);
                showScanner();
            }
        });

        document.getElementById('logout-btn').addEventListener('click', () => {
            localStorage.removeItem('jwt_token');
            showLogin();
        });
    </script>
</body>
</html>
