<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>База Товарів</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; padding: 10px; max-width: 600px; margin: 0 auto; background: #f4f6f8; }
        .card { background: white; padding: 14px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.06); margin-bottom: 10px; }
        .btn-nav { background: #28a745; text-decoration: none; display: block; text-align: center; color: white; padding: 10px; border-radius: 5px; font-weight: bold; margin-bottom: 10px; }
        input, select, textarea { width: 100%; padding: 8px; font-size: 14px; border: 1px solid #ced4da; border-radius: 5px; box-sizing: border-box; }
        textarea { height: 44px; resize: none; }

        .products-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 10px; }
        .products-table th, .products-table td { border: 1px solid #dee2e6; padding: 6px; text-align: left; vertical-align: top; }
        .btn-edit { background: #17a2b8; color: white; border: none; padding: 4px 6px; border-radius: 4px; cursor: pointer; }
        .btn-info-sm { background: #e7f5ff; color: #004085; border: 1px solid #a5d8ff; padding: 2px 4px; font-size: 10px; border-radius: 3px; cursor: pointer; margin-top: 3px; display: inline-block; }

        .info-details { display: none; background: #e7f5ff; color: #004085; padding: 6px; font-size: 11px; border-radius: 4px; margin-top: 4px; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 100; }
        .modal-content { background: white; padding: 16px; border-radius: 8px; width: 90%; max-width: 400px; max-height: 90vh; overflow-y: auto; }
        
        .price-group { display: flex; gap: 4px; }
        .price-group input { flex: 2; }
        .price-group select { flex: 1; }
        .desc-text { font-size: 11px; color: #555; font-style: italic; margin-top: 2px; }
        
        /* Таблична мініатюра товару */
        .prod-img { width: 45px; height: 45px; object-fit: cover; border-radius: 4px; border: 1px solid #ddd; margin-right: 6px; float: left; }
    </style>
</head>
<body>

    <a href="/" class="btn-nav">⬅️ Повернутися до сканера</a>

    <div class="card">
        <h3>📋 База Товарів на Складі</h3>
        <input type="text" id="search" placeholder="🔍 Пошук за назвою, ШК, коміркою...">
        
        <div id="table-container">Завантаження...</div>
    </div>

    <!-- МОДАЛЬНЕ ВІКНО РЕДАГУВАННЯ -->
    <div id="edit-modal" class="modal">
        <div class="modal-content">
            <h3>✏️ Редагувати товар</h3>
            <form id="edit-form">
                <input type="hidden" id="edit-id">
                
                <!-- 📸 Фото у модалці -->
                <div style="margin-bottom:8px; background:#f8f9fa; padding:6px; border-radius:5px;">
                    <label>Змінити фото товару:</label>
                    <input type="file" id="edit-image" accept="image/*" capture="environment">
                    <img id="edit-img-preview" style="max-width:70px; max-height:70px; display:none; margin-top:5px; border-radius:4px;">
                </div>

                <div style="margin-bottom:8px;"><label>Назва:</label><input type="text" id="edit-name" required></div>
                <div style="margin-bottom:8px;"><label>Примітка / Опис:</label><textarea id="edit-description"></textarea></div>
                <div style="margin-bottom:8px;"><label>Штрихкод:</label><input type="text" id="edit-barcode" required></div>
                <div style="margin-bottom:8px;"><label>Комірка:</label><input type="text" id="edit-location"></div>
                
                <div style="margin-bottom:8px;">
                    <label>Закуп:</label>
                    <div class="price-group">
                        <input type="number" step="0.01" id="edit-p-price">
                        <select id="edit-p-curr">
                            <option value="EUR">EUR (€)</option>
                            <option value="USD">USD ($)</option>
                            <option value="UAH">UAH (₴)</option>
                        </select>
                    </div>
                </div>

                <div style="margin-bottom:8px;">
                    <label>Продаж:</label>
                    <div class="price-group">
                        <input type="number" step="0.01" id="edit-s-price">
                        <select id="edit-s-curr">
                            <option value="UAH">UAH (₴)</option>
                            <option value="EUR">EUR (€)</option>
                            <option value="USD">USD ($)</option>
                        </select>
                    </div>
                </div>

                <div style="margin-bottom:8px;"><label>Кількість:</label><input type="number" id="edit-qty" min="0"></div>
                <div style="display:flex; gap:8px; margin-top:12px;">
                    <button type="submit" style="background:#28a745; color:white; border:none; padding:8px; flex:1; border-radius:4px;">Зберегти</button>
                    <button type="button" onclick="closeModal()" style="background:#6c757d; color:white; border:none; padding:8px; flex:1; border-radius:4px;">Скасувати</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const currSymbols = { 'EUR': '€', 'USD': '$', 'UAH': '₴' };
        let searchTimeout;

        window.addEventListener('DOMContentLoaded', () => loadProducts());

        function formatParsedAttributes(extraInfo) {
            if (!extraInfo) return '';
            const attrs = extraInfo.parsed_attributes || {};
            let html = '';

            if (attrs.country) html += `<b>Країна:</b> ${attrs.country}<br>`;
            if (attrs.prefix) html += `<b>Префікс GS1:</b> ${attrs.prefix}<br>`;
            if (attrs.serial_number) html += `<b>Серійник:</b> ${attrs.serial_number}<br>`;
            if (attrs.article_code) html += `<b>Артикул:</b> ${attrs.article_code}<br>`;
            
            return html;
        }

        async function loadProducts(q = '') {
            const token = localStorage.getItem('jwt_token');
            const container = document.getElementById('table-container');

            try {
                const res = await fetch(`/api/products/?search=${encodeURIComponent(q)}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!res.ok) {
                    container.innerHTML = "<span style='color:red;'>Помилка завантаження</span>";
                    return;
                }

                const data = await res.json();
                const items = data.results || data || [];

                if (items.length === 0) {
                    container.innerHTML = "<i>База порожня</i>";
                    return;
                }

                let html = `
                    <table class="products-table">
                        <thead>
                            <tr>
                                <th>Товар / ШК</th>
                                <th>Ціни</th>
                                <th>К-сть</th>
                                <th>Дії</th>
                            </tr>
                        </thead>
                        <tbody>
                `;

                items.forEach(item => {
                    const cleanInfo = formatParsedAttributes(item.parsed_extra_info);
                    const loc = item.location ? item.location.code : '-';

                    const pPrice = item.purchase_price ? `${item.purchase_price} ${currSymbols[item.purchase_currency] || item.purchase_currency}` : '-';
                    const sPrice = item.selling_price ? `${item.selling_price} ${currSymbols[item.selling_currency] || item.selling_currency}` : '-';

                    const descHtml = item.description ? `<div class="desc-text">💬 ${item.description}</div>` : '';
                    const imgHtml = item.image ? `<img src="${item.image}" class="prod-img">` : '';

                    html += `
                        <tr>
                            <td>
                                ${imgHtml}
                                <b>${item.name}</b><br>
                                <small style="color:#6c757d;">${item.barcode}</small><br>
                                ${descHtml}
                                <small style="color:#28a745;">📍 Комірка: <b>${loc}</b></small><br>
                                ${cleanInfo ? `<button class="btn-info-sm" onclick="toggleInfo(${item.id})">ℹ️ Інфо</button><div id="info-${item.id}" class="info-details">${cleanInfo}</div>` : ''}
                            </td>
                            <td><small>Закуп: <b>${pPrice}</b><br>Продаж: <b>${sPrice}</b></small></td>
                            <td><b>${item.quantity}</b></td>
                            <td>
                                <button class="btn-edit" onclick="openModal(${JSON.stringify(item).replace(/"/g, '&quot;')})">✏️</button>
                            </td>
                        </tr>
                    `;
                });

                html += `</tbody></table>`;
                container.innerHTML = html;
            } catch (err) {
                container.innerHTML = "<span style='color:red;'>Помилка мережі</span>";
            }
        }

        function toggleInfo(id) {
            const el = document.getElementById(`info-${id}`);
            el.style.display = (el.style.display === 'block') ? 'none' : 'block';
        }

        document.getElementById('search').addEventListener('input', (e) => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => loadProducts(e.target.value.trim()), 300);
        });

        function openModal(prod) {
            document.getElementById('edit-id').value = prod.id;
            document.getElementById('edit-name').value = prod.name;
            document.getElementById('edit-description').value = prod.description || '';
            document.getElementById('edit-barcode').value = prod.barcode;
            document.getElementById('edit-location').value = prod.location ? prod.location.code : '';
            document.getElementById('edit-p-price').value = prod.purchase_price || '';
            document.getElementById('edit-p-curr').value = prod.purchase_currency || 'EUR';
            document.getElementById('edit-s-price').value = prod.selling_price || '';
            document.getElementById('edit-s-curr').value = prod.selling_currency || 'UAH';
            document.getElementById('edit-qty').value = prod.quantity;
            
            const prevImg = document.getElementById('edit-img-preview');
            if (prod.image) {
                prevImg.src = prod.image;
                prevImg.style.display = 'block';
            } else {
                prevImg.style.display = 'none';
            }

            document.getElementById('edit-modal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('edit-modal').style.display = 'none'; }

        document.getElementById('edit-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const token = localStorage.getItem('jwt_token');
            const id = document.getElementById('edit-id').value;

            const formData = new FormData();
            formData.append('name', document.getElementById('edit-name').value);
            formData.append('description', document.getElementById('edit-description').value);
            formData.append('barcode', document.getElementById('edit-barcode').value);
            formData.append('location_code', document.getElementById('edit-location').value.toUpperCase());
            formData.append('purchase_currency', document.getElementById('edit-p-curr').value);
            formData.append('selling_currency', document.getElementById('edit-s-curr').value);
            formData.append('quantity', parseInt(document.getElementById('edit-qty').value) || 0);

            if (document.getElementById('edit-p-price').value) {
                formData.append('purchase_price', document.getElementById('edit-p-price').value);
            }
            if (document.getElementById('edit-s-price').value) {
                formData.append('selling_price', document.getElementById('edit-s-price').value);
            }

            const imgFile = document.getElementById('edit-image').files[0];
                if (imgFile) {
                formData.append('image', imgFile);
            }

            await fetch(`/api/products/${id}/`, {
                method: 'PATCH',
                headers: { 'Authorization': `Bearer ${token}` },
                body: formData
            });

            closeModal();
            loadProducts();
        });
    </script>
</body>
</html>
